name: CI

on:
  push:
    branches: [main]
    # 纯文档提交不跑 8 个 job：CI 只对会进镜像/进服务器的东西负责。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".codex-attachments/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: "3"
  CARGO_NET_TIMEOUT: "30"

jobs:
  web:
    name: web (biome / tsc / vitest)
    runs-on: ubuntu-24.04
    # Hang guard only: normal runs finish in ~1 minute. A timeout fails the job, never passes it.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm tsc --noEmit
      - run: pnpm vitest run
      # The image job builds the production bundle once.

  # Lint and test run on separate runners (shared rust-cache): clippy 的 check 产物和
  # test 的二进制产物本来就不能复用，串行等于把工作区编两遍。
  lint:
    name: rust (fmt / clippy)
    runs-on: ubuntu-24.04
    # Hang guard only: ~4 minutes warm.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: BoringSSL build deps
        run: bash tools/ci/build-deps.sh
        timeout-minutes: 5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # fmt 不编译：放在最前面，格式错误 30 秒内就能反馈
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: rust (test)
    runs-on: ubuntu-24.04
    # Hang guard only: ~5 minutes warm, worst-case cold build stays well below this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: BoringSSL build deps
        run: bash tools/ci/build-deps.sh
        timeout-minutes: 5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  e2e:
    name: e2e (release smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Use runner BoringSSL build tools
        run: bash tools/ci/build-deps.sh
        timeout-minutes: 5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      # Hosted runners often cannot resolve archive.ubuntu.com; the image already
      # has Chromium's system libraries. Only fetch the browser itself.
      - run: pnpm exec playwright install chromium
        working-directory: web
        timeout-minutes: 10
      - run: cargo build --locked -p xtask
      - name: Start the full local stack (fake upstream, synthetic data) and the web dev server
        run: |
          cargo xtask dev --data "$RUNNER_TEMP/owl-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /tmp/gate.log 2>&1 &
          (cd web && pnpm exec vite --port 5174 --strictPort > /tmp/vite.log 2>&1 &)
          for _ in $(seq 1 90); do
            curl -fsS -m 2 http://127.0.0.1:18000/healthz >/dev/null 2>&1 && curl -fsS -m 2 -o /dev/null http://localhost:5174/ && exit 0
            sleep 2
          done
          cat /tmp/gate.log /tmp/vite.log; exit 1
      - run: pnpm exec playwright test e2e/release.spec.ts
        working-directory: web
        env:
          E2E_BASE: http://localhost:5174
          E2E_COOKIES: ${{ runner.temp }}/owl-e2e-${{ github.run_id }}-${{ github.run_attempt }}/cookies.json
        timeout-minutes: 5

  deploy-safety:
    name: deploy-safety (shell and cutover guards)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check every tracked bash script parses
        # 自动发现，不再维护硬编码清单：以前删掉一个脚本、忘了同步这份清单，CI 立刻变红，
        # 而失败的其实是清单本身不是代码。现在按 shebang 找 bash 脚本，增删都自动跟上。
        run: |
          set -eu
          fail=0
          while IFS= read -r -d '' f; do
            first=$(head -n1 "$f" 2>/dev/null || true)
            case $first in
              '#!'*bash*)
                bash -n "$f" || { echo "::error file=$f::shell 语法错误"; fail=1; }
                ;;
            esac
          done < <(git ls-files -z)
          exit $fail
      - name: Check the server-side ops scripts the deploy ships still exist
        # tools/deploy.sh 会把 RUNTIME_OPS 里的文件 rsync 到 /opt/owl/ops/；这里核对它们都在，
        # 免得同步悄悄变成空操作（以前 close-stale-deliveries.sh 就只存在于服务器上）。
        run: |
          set -eu
          for f in nightly_backup.sh close-stale-deliveries.sh; do
            [ -s "deploy/v3/ops/$f" ] || { echo "::error::deploy/v3/ops/$f 缺失或为空"; exit 1; }
          done
      - name: Exercise safe image staging and queue wait
        run: bash tools/ci/test-cutover.sh

  secrets:
    name: secrets (gitleaks, synthetic fixtures only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fixture checker self-test (the rules really block)
        run: tools/ci/check-fixtures.sh --self-test
      - name: Fixtures and test data contain synthetic values only
        run: tools/ci/check-fixtures.sh

  # Artifacts build in parallel with the checks to save wall time. They are only deployable
  # when the whole run succeeded: tools/deploy.sh refuses any run whose conclusion is not success.
  ops-binary:
    name: nai-ops (static musl binary)
    runs-on: ubuntu-24.04
    # Hang guard only: ~1 minute warm; a cold musl release build stays well below this.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Host Ubuntu apt DNS fails (archive.ubuntu.com / azure mirrors). The image
      # job already proves rust:1.99-bookworm can apt-get via Debian mirrors.
      - name: Build static musl nai-ops in Debian
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1.99-bookworm bash -c '
            set -euo pipefail
            export PATH="/usr/local/cargo/bin:$PATH"
            apt-get update
            apt-get install -y --no-install-recommends musl-tools
            rustup target add x86_64-unknown-linux-musl
            cargo build --release --locked --target x86_64-unknown-linux-musl -p gate-ops --bin nai-ops
          '
          sudo chmod -R a+rX target/x86_64-unknown-linux-musl/release
      - uses: actions/upload-artifact@v7
        with:
          name: nai-ops-linux-musl
          path: target/x86_64-unknown-linux-musl/release/nai-ops
          retention-days: 7

  image:
    name: image (docker tar artifact)
    runs-on: ubuntu-24.04
    # Hang guard only: ~8.5 minutes warm via the gha build cache; a fully cold build stays well below this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # No registry push: the server holds no GitHub credentials. tools/deploy.sh downloads this tar and docker-loads it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: owl-gate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/owl-gate.tar
      # Smoke: the image starts, /healthz reads and writes the DB, and the landing page embeds the web bundle
      # (rust-embed does not fail on a missing dist). No upstream token, no Discord, data on tmpfs.
      - name: Image smoke test
        run: |
          docker load -i /tmp/owl-gate.tar
          docker run -d --name smoke -p 18080:8000 --tmpfs /app/data:uid=10001,gid=10001 owl-gate:${{ github.sha }}
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:18080/healthz | grep -q '"ok":true'; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs smoke; exit 1; }
          curl -fsS -m 5 http://127.0.0.1:18080/ | grep -q '/_owl/' || { echo "landing page does not embed the web bundle"; docker logs smoke; exit 1; }
          docker exec smoke /usr/local/bin/nai-gate healthcheck
          cid=$(docker create owl-gate:${{ github.sha }})
          docker cp "$cid:/opt/web-dist/landing.html" /tmp/web-dist-landing.html
          docker rm "$cid"
          [ -s /tmp/web-dist-landing.html ] || { echo "image is missing /opt/web-dist/landing.html"; exit 1; }
          docker rm -f smoke
      - run: gzip -1 /tmp/owl-gate.tar
      - uses: actions/upload-artifact@v7
        with:
          name: owl-gate-image
          path: /tmp/owl-gate.tar.gz
          # 每版镜像约 250MB，一天能推十来次。原先是 7 天，光 CI 产物就压着十几 GB 配额；
          # tools/deploy.sh 默认等本次提交的 CI，2 天足够回退到前一天的构建。
          retention-days: 2
          compression-level: 0

  ready:
    name: ready to deploy
    needs: [web, lint, test, e2e, deploy-safety, secrets, ops-binary, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Print the deploy command
        run: |
          echo "sha=${GITHUB_SHA}"
          echo "laptop: tools/deploy.sh"
          echo "github: gh workflow run Deploy --ref main"
