# 外部探测：每 5 分钟从 GitHub 的机器（不在我们自己的服务器上）访问站点的健康检查，连续失败就发 Discord 告警，恢复时再发一条。
# 只访问公网地址，不碰 NovelAI，不引入任何新的出口 IP。
# - 只在「状态变化」时发消息：上一次运行是成功、这一次失败 → 故障告警；上一次失败、这一次成功 → 恢复通知。
# - 失败时让这次运行标红（GitHub 的运行列表里一眼能看到，也方便下一次对比）。
# - 需要仓库 Secret：DISCORD_ALERT_WEBHOOK（告警频道的 Webhook）、STATUS_MIRROR_URL（独立状态页镜像地址，可选）。
# 注意：GitHub 的定时任务最短 5 分钟，高峰时会被推迟几分钟，所以告警大约延迟 5～15 分钟。
name: 站点探测

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "发一条测试消息到 Discord（验证告警通道），不做探测"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GATE_URL: https://gate.davidzhao.top
      WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
      MIRROR: ${{ secrets.STATUS_MIRROR_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 发测试消息
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "没有配置 DISCORD_ALERT_WEBHOOK"; exit 1; }
          now=$(TZ=Asia/Shanghai date '+%m-%d %H:%M')
          curl -fsS -m 15 -H 'Content-Type: application/json' \
            -d "{\"content\":\"✅ 猫头鹰公益站 · 告警通道测试（${now} 北京时间）。收到这条说明站点探测的 Discord 告警已接通：站点连续探测失败时会在这里提醒你，恢复后再提醒一次。\"}" \
            "$WEBHOOK" >/dev/null
          echo "测试消息已发送"

      - name: 探测站点
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_alert) }}
        run: |
          set -uo pipefail
          # 健康检查：网关通过 Caddy 返回 {"ok":true,...}；Caddy 挂了 / 网关挂了 / 服务器不可达都会失败。
          # 连试 3 次（间隔 10 秒），避免一次网络抖动就告警。
          ok=0; detail=""
          for i in 1 2 3; do
            code=$(curl -sS -m 15 -o /tmp/h.json -w '%{http_code}' "$GATE_URL/healthz" 2>/tmp/err.txt) || code="000"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/h.json; then ok=1; break; fi
            detail="HTTP ${code} $(head -c 120 /tmp/err.txt | tr '\n' ' ')"
            sleep 10
          done
          echo "ok=$ok detail=$detail"

          # 上一次已完成的运行结果（不含这次）：只在状态变化时发消息
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow uptime.yml --status completed --limit 1 \
                   --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          echo "prev=$prev"

          now=$(TZ=Asia/Shanghai date '+%m-%d %H:%M')
          mirror_line=""
          [ -n "$MIRROR" ] && mirror_line="\\n独立状态页（只显示状态，不能出图）：${MIRROR}"

          post() {
            [ -n "$WEBHOOK" ] || { echo "没有配置 DISCORD_ALERT_WEBHOOK，跳过发送"; return 0; }
            curl -fsS -m 15 -H 'Content-Type: application/json' -d "{\"content\":\"$1\"}" "$WEBHOOK" >/dev/null || echo "发送 Discord 失败"
          }

          if [ "$ok" = "1" ]; then
            if [ "$prev" = "failure" ]; then
              post "🟢 猫头鹰公益站 已恢复访问（${now} 北京时间）。"
            fi
            exit 0
          fi

          if [ "$prev" != "failure" ]; then
            post "🔴 猫头鹰公益站 无法访问（${now} 北京时间）：${detail}。\\n已连续 3 次探测失败（外部探测，不在我们自己的服务器上）。可能是服务器 / 网络 / Caddy / 网关故障，请检查并按需在后台发布状态页公告。${mirror_line}"
          fi
          exit 1
